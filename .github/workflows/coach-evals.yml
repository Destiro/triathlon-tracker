name: Coach evals

# Puts the coach through every scenario in evals/scenarios.ts against the real Claude API and grades it. Run it by
# hand (GitHub app > Actions > Coach evals > Run workflow) after changing the prompt, the tools or the model. Needs the
# ANTHROPIC_API_KEY secret; a full run costs roughly one to two US dollars.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Coach model
        type: choice
        options: [sonnet, haiku, opus]
        default: sonnet
      judge:
        description: Judge model (none skips the graded rubrics)
        type: choice
        options: [opus, sonnet, none]
        default: opus
      repeat:
        description: Runs of each scenario (answers vary; 3 shows how steady it is)
        type: choice
        options: ['1', '3']
        default: '1'

permissions:
  contents: read

jobs:
  evals:
    name: Coach evals (${{ inputs.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions) first."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval -- --model "${{ inputs.model }}" --judge "${{ inputs.judge }}" --repeat "${{ inputs.repeat }}"
      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-eval-transcripts
          path: evals/results/
          if-no-files-found: ignore
