name: CI

# Runs on every push, so a feature branch is checked before it is merged into main.
on:
  push:
  workflow_dispatch:

# A new push to the same branch cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The github-actions reporter lists failing tests as annotations on the run.
      - run: npm test -- --ci --reporters=default --reporters=github-actions --testPathIgnorePatterns='(notes|issues)[.](clear[.])?screens' --testPathIgnorePatterns='/node_modules/' --testPathIgnorePatterns='/src/__tests__/helpers.ts'

  bundle-android:
    name: Android bundle builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compiles the whole JS bundle, so a bad import or missing dependency fails the check.
      - run: npx expo export --platform android

  expo-doctor:
    name: Expo doctor (dependency health)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: it flags packages a patch release behind and calls external services that can be flaky.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
